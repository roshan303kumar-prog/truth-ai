{% extends "base.html" %}

{% block title %}Bad Request (400) — TRUTH AI{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="truth-card p-5 max-w-600 mx-auto">
        <h1 class="display-1 fw-bold text-warning mb-2">400</h1>
        <h3 class="text-white fw-bold mb-3">Invalid Request Format</h3>
        <p class="text-secondary mb-4">

        <a href="{{ url_for('views.index') }}" class="btn btn-truth-outline">
            <i class="fa-solid fa-house me-1"></i> Return Home

    </div>
</div>
{% endblock %}
