{% extends "base.html" %}

{% block title %}Sign In — TRUTH AI{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="truth-card shadow-lg p-4 p-md-5">
                <div class="text-center mb-4">
                    <i class="fa-solid fa-shield-halved text-info fs-1 mb-2"></i>
                    <h2 class="fw-bold mb-1">Welcome Back</h2>
                    <p class="text-secondary small">Access your personal verification dashboard & saved reports</p>
                </div>

                <form action="{{ url_for('auth.login') }}" method="POST">
                    <div class="mb-3">
                        <label for="login_id" class="form-label text-white small fw-semibold">Username or Email</label>
                        <div class="position-relative">
                            <i class="fa-regular fa-envelope position-absolute top-50 start-0 translate-middle-y ms-3 text-secondary"></i>
                            <input type="text" id="login_id" name="login_id" class="truth-input ps-5" placeholder="username or email" value="{{ login_id or '' }}" required autofocus>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label text-white small fw-semibold">Password</label>
                        <div class="position-relative">
                            <i class="fa-solid fa-lock position-absolute top-50 start-0 translate-middle-y ms-3 text-secondary"></i>
                            <input type="password" id="password" name="password" class="truth-input ps-5" placeholder="Enter password" required>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-4 small">
                        <div class="form-check">
                            <input class="form-check-input bg-dark border-secondary" type="checkbox" name="remember" id="remember" checked>
                            <label class="form-check-label text-secondary" for="remember">
                                Remember this device
                            </label>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-truth-primary w-100 py-2 mb-3">
                        <i class="fa-solid fa-arrow-right-to-bracket me-1"></i> Sign In to Account
                    </button>
                </form>

                <!-- Demo Credentials Helper -->
                <div class="p-3 rounded bg-dark border border-secondary border-opacity-25 mb-3 text-center">
                    <small class="text-secondary d-block mb-2">Academic / Evaluator Demo Credentials:</small>
                    <button type="button" class="btn btn-sm btn-outline-info py-1 px-3" onclick="document.getElementById('login_id').value='demo_user'; document.getElementById('password').value='TruthAI@2026';">
                        <i class="fa-solid fa-wand-magic-sparkles me-1"></i> Auto-Fill Demo Credentials
                    </button>
                </div>

                <div class="text-center small text-secondary">
                    Don't have an account yet? <a href="{{ url_for('auth.register') }}" class="text-info fw-semibold">Register here</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
